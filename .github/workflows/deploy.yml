name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: false  # 禁用 Git LFS，避免大文件下载问题
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Update data-embed.js from Cloud API
      run: node update-data-from-api.js
    
    - name: Sync game descriptions from Cloud API
      run: node sync-descriptions.js
        
    - name: Clean Deleted Game Pages
      run: node clean-deleted-games.js --force
      continue-on-error: true
      
    - name: Generate Game Pages
      run: node generate-games.js
      
    - name: Generate SEO Links and Sitemap
      run: node generate-seo.js
      
    - name: Commit Generated Pages
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # 先删除 Git 中已不存在于本地的 games 文件（孤儿页面）
        # 注意：grep 无匹配时会返回 1 导致整个步骤中断，必须加 || true 兜底
        git diff --name-only --diff-filter=D | grep '^games/' | xargs -r git rm --ignore-unmatch || true
        # 添加所有变更（包括新增、修改、删除；同时提交数据文件，保证仓库与线上一致）
        git add -A games/ sitemap.xml index.html data-embed.js web-descriptions.json
        git diff --staged --quiet || (git commit -m "Auto-generate game pages and SEO" && git push)
      continue-on-error: true
        
    - name: Install Vercel CLI
      run: npm install --global vercel@latest
      
    - name: Pull Vercel Environment Information
      run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      
    - name: Build Project Artifacts
      run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      
    - name: Deploy Project Artifacts to Vercel
      run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz
